<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sistecrédito · Nexus</title>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Red Hat Display',sans-serif;background:radial-gradient(ellipse at 15% 40%,#00369c 0%,transparent 55%),radial-gradient(ellipse at 88% 15%,#3ec92b 0%,transparent 48%),radial-gradient(ellipse at 55% 85%,#092872 0%,transparent 58%),#0a0a1a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.box{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.13);border-radius:24px;padding:52px 48px;max-width:500px;width:100%;text-align:center;}
.brand{font-size:26px;font-weight:900;color:#fff;margin-bottom:32px;letter-spacing:-0.5px;}
.brand span{color:#3ec92b;}
.icon{font-size:44px;margin-bottom:20px;}
h1{font-size:20px;font-weight:900;color:#fff;line-height:1.4;margin-bottom:16px;}
p{font-size:15px;font-weight:300;color:rgba(255,255,255,0.65);line-height:1.65;}
p b{color:rgba(255,255,255,0.9);font-weight:700;}
</style>
</head>
<body>
<div class="box">
  <div class="brand">siste<span>crédito</span> · +nexus</div>
  <div class="icon">🔒</div>
  <h1>Informe web deshabilitado</h1>
  <p>Este informe ya no está disponible en línea. Puedes consultarlo en el <b>archivo adjunto del correo</b> que fue enviado al comité.</p>
</div>
</body>
</html>
